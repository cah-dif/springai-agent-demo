spring:
  ai:
    openai:
      # 二选一：直接填 Key，或改成 ${DEEPSEEK_KEY} 用环境变量
      api-key: 在这里填入你的DeepSeek Key
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
    tools:
      limits:
        max-total-tool-calls: 5          # 一次提问，所有工具加起来最多调用5次
        max-calls-per-tool-default: 3    # 单个工具最多调用3次
        on-limit-exceeded: RETURN_ERROR_RESPONSE

  datasource:
    # 文件模式，数据保存到项目下的 data/todo_db，重启不丢
    url: jdbc:h2:file:./data/todo_db;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true                      # 开启 H2 网页控制台
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update                   # 启动自动建表/补字段，不清数据
    show-sql: true
    properties:
      hibernate:
        format_sql: true
